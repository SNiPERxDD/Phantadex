course_metadata:
  course_name: a[title*='Home Page']
  module_name: button.cds-AccordionHeader-button[aria-expanded='true'] span
video_controls:
  play_button: button[aria-label='Play']
  current_time: span.current-time-display
  duration: span.duration-display
  mute_button: button[aria-label='Unmute']
content:
  reading_body: div.rc-CML
navigation:
  next_item: button[aria-label='Go to next item']
  previous_item: "button:has-text('Go to Previous Item')"
  mark_complete: button[data-testid='mark-complete']
  completed_stamp: a[aria-label*='Completed']
transcript:
  transcript_container: .rc-Transcript
  downloads_tab: "[data-testid='item-tool-panel-button-files']"
  transcript_download_link: "a[download='transcript.txt']"
sidebar:
  success_icon: '[data-testid=''learn-item-success-icon'']'
