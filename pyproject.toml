[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phantadex"
dynamic = ["version"]
description = "Course traversal, mapping, and archival through an authenticated Chrome session"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["coursera", "playwright", "cdp", "archival", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = ["playwright>=1.40,<2", "plyer>=2,<3", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/SNiPERxDD/course-auto"
Source = "https://github.com/SNiPERxDD/course-auto"
Changelog = "https://github.com/SNiPERxDD/course-auto/blob/main/CHANGELOG.md"
Issues = "https://github.com/SNiPERxDD/course-auto/issues"

[project.scripts]
phantadex = "phantadex.cli:main"
pdex = "phantadex.cli:main"

[tool.setuptools.dynamic]
version = {attr = "phantadex.__version__"}

[tool.setuptools.packages.find]
include = ["phantadex*"]

[tool.setuptools.package-data]
phantadex = ["config.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Blind excepts are deliberate at every Playwright boundary: the driver raises a
# wide, version-dependent set of errors and a missed element must degrade to the
# next selector rather than end the run.
select = ["E", "F", "W", "I", "UP"]
