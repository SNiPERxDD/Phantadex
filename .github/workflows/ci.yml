name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check phantadex tests

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 3.8 legs run on Intel images: actions/setup-python publishes no
          # arm64 macOS build of 3.8, so macos-latest cannot provision it.
          - os: macos-13
            python: '3.8'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.8'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python run_tests.py
      - run: python -m pip install build
      - run: python -m build
